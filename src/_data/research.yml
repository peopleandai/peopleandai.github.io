# =====================================================================
#  연구 (Research)
#  - vision: 연구 비전 문장 + 핵심 가치
#  - topics: 연구 주제 카드. 새 주제는 블록을 복사해서 추가하세요.
#      id     : 영문 소문자 고유 이름 (publications.yml의 topics와 연결됩니다)
#      status : ongoing(진행 중) | past(이전 연구)
#      color  : green | red | navy | blue | yellow  (카드 윗선·아이콘 색 — 실제 색은 style.css의 --c-* 변수)
#      image  : src/assets/img/research/ 폴더 안 이미지 파일
# =====================================================================

vision:
  ko: "<em>사람과 조화롭게 협력하고</em> <em>신뢰할 수 있으며</em> <em>사회에 유익한</em> AI 기술을 개발합니다."
  en: "We develop AI technologies that <em>collaborate harmoniously with people</em>, <em>are trustworthy</em>, and <em>benefit society</em>."

values:
  - icon: user
    en: User Friendly
    ko: 사용 편의성
  - icon: eye
    en: Transparent
    ko: 투명성
  - icon: heart
    en: Trustworthy
    ko: 신뢰성
  - icon: bulb
    en: Explainable
    ko: 설명 가능성
  - icon: scale
    en: Fair
    ko: 공정성

open_note:
  ko: "이 밖에도 <strong>인간과 AI의 상호작용에 관한 다양한 주제</strong>에 열려 있어요!"
  en: "We are also open to <strong>many other topics on human-AI interaction</strong>!"

# 진행 중인 연구 4개: 카드에는 이름(name)과 한 문장 설명(question)이 나옵니다.
topics:
  - id: hallucination
    status: ongoing
    color: red
    icon: alert
    image: hallucination.jpg
    name:
      en: AI Hallucination & Trust
      ko: AI의 잘못된 정보 생성과 사용자의 신뢰 형성
    question:
      en: How can we design interfaces that help people judge how much to trust AI when it generates inaccurate information?
      ko: AI가 사실과 다른 정보를 생성할 때, 사람들이 AI를 얼마나 신뢰해야 할지 판단하도록 돕는 인터페이스를 설계합니다.
    keywords: [Factuality, Explainability, Trust Calibration, Over-reliance]

  - id: evaluation
    status: ongoing
    color: green
    icon: clipboard
    image: evaluation.jpg
    name:
      en: AI Evaluation
      ko: AI를 사용한 평가 시스템
    question:
      en: How can AI faithfully understand and reflect evaluators’ expertise and judgment criteria to deliver reliable data quality assessments?
      ko: AI가 평가자의 전문성과 판단 기준을 충실하게 이해하고 반영하여, 신뢰할 수 있는 데이터 품질 평가를 수행하는 방법을 연구합니다.
    keywords: [LLM-as-a-Judge, Human-in-the-loop, Evaluation Tools]
    links:
      - label: EvalAssist
        url: https://ibm.github.io/eval-assist/

  - id: disclosure
    status: ongoing
    color: navy
    icon: eye
    image: disclosure.jpg
    name:
      en: AI Disclosure
      ko: AI 사용 여부 및 범위의 공개
    question:
      en: As the line between AI-generated and human-created work blurs, when and how should the use of AI be disclosed?
      ko: AI 생성물과 인간 창작물의 경계가 모호해지는 환경에서, AI 활용 사실을 언제, 어떻게 공개해야 하는지 연구합니다.
    keywords: [Transparency, Attribution, Ownership, Accountability]

  - id: agent
    status: ongoing
    color: blue
    icon: robot
    image: agent.jpg
    name:
      en: AI Agent Design
      ko: AI 에이전트 설계
    question:
      en: How can people effectively oversee, understand, and stay in control of AI agents and their actions?
      ko: AI 에이전트의 행동을 사람이 어떻게 효과적으로 감독하고 이해하며 통제할 수 있을지 연구합니다.
    keywords: [Human Oversight, Agent Governance, Human Control]

  - id: conversation
    status: ongoing
    color: yellow
    icon: chat
    image: conversation.jpg
    name:
      en: Conversational Agents & Interfaces
      ko: 대화형 에이전트와 인터페이스
    question:
      en: How can conversational agents improve communication and collaboration?
      ko: 그룹 대화를 돕는 대화형 에이전트, 자연어 인터페이스의 그라운딩(grounding) 등 사람과 AI의 대화 경험을 설계합니다.
    keywords: [Conversational Agents, Group Chat, Natural Language Interfaces]

