headline:
  ko: 함께할 학생을 찾습니다
  en: Join PANDA Lab

positions:
  - ko: 학부연구생
    en: Undergraduate Researchers
  - ko: 석사과정
    en: M.S. Students

intro:
  ko: "인간중심 AI와 HCI 연구에 관심 있는 학생을 찾습니다."
  en: "We are looking for motivated students interested in human-centered AI and HCI to join our lab."

apply:
  title: { ko: "지원하는 방법", en: "How to Apply" }
  text:
    ko: "아래 내용을 간단히 적어 이메일(<a href=\"mailto:dohyojin@hanyang.ac.kr\">dohyojin@hanyang.ac.kr</a>)로 보내 주세요."
    en: "Please send a short email (<a href=\"mailto:dohyojin@hanyang.ac.kr\">dohyojin@hanyang.ac.kr</a>) covering the following."
  items:
    - ko: "본인 소개와 배경 (전공, 관련 경험이나 과목)"
      en: "A brief introduction and background (major, relevant experience or coursework)"
    - ko: "원하는 참여 형태 (학부연구생, 대학원 진학, 캡스톤, 개별연구 등)와 시기 (방학, 학기 중 등)"
      en: "How you would like to participate (undergraduate research, graduate study, capstone, independent study, etc.) and when (school break, during the semester, etc.)"
    - ko: "관심 있는 연구 주제 (선택 사항)"
      en: "Research topics you are interested in (optional)"
